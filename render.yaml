services:
  # Backend FastAPI Service
  - type: web
    name: ask-my-github-api
    env: python
    buildCommand: "pip install -r backend/requirements.txt"
    startCommand: "uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: GITHUB_TOKEN
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: openai/gpt-oss-120b
      - key: EMBEDDING_PROVIDER
        value: chroma_default
      - key: CORS_ORIGINS
        value: "*"
    disk:
      name: chroma-data
      mountPath: /data
      sizeGB: 5

  # Frontend Static Site
  - type: web
    name: ask-my-github-ui
    env: static
    buildCommand: "cd frontend && npm install && npm run build"
    staticPublishPath: "./frontend/dist"
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: ask-my-github-api
          property: host
